# ~/.config/walker/config.toml
# -------------------------------------------------------------------
# Behaviour lives here; colours live in the theme's style.css.
# This file just tells Walker which theme to load (= "stormclouds").
# -------------------------------------------------------------------

force_keyboard_focus = false
close_when_open      = true
click_to_close       = true
as_window            = false        # layer-shell overlay (recommended on Hyprland)
single_click_activation = true
selection_wrap       = false
exact_search_prefix  = "'"
theme                = "notch"          # <-- the theme folder name
disable_mouse        = false
page_jump_items      = 10
keybind_symbols      = true            # render ⌃+⏎ instead of "ctrl Return"

[shell]
exclusive_zone = -1
layer          = "overlay"
anchor_top     = true
anchor_bottom  = true
anchor_left    = true
anchor_right   = true

[placeholders]
"default"             = { input = "Search…", list = "No results" }
"desktopapplications" = { input = "Launch…",  list = "No applications" }
"calc"                = { input = "Calculate…", list = "Enter an expression" }
"files"               = { input = "Find files…", list = "No files" }
"websearch"           = { input = "Search the web…", list = "" }

[keybinds]
close              = ["Escape"]
next               = ["Down", "ctrl j"]
previous           = ["Up", "ctrl k"]
toggle_exact       = ["ctrl e"]
resume_last_query  = ["ctrl r"]
quick_activate     = ["F1", "F2", "F3", "F4"]
page_down          = ["Page_Down"]
page_up            = ["Page_Up"]
show_actions       = ["alt j"]

[providers]
default     = ["desktopapplications", "calc", "websearch"]
empty       = ["desktopapplications"]
max_results = 50

[[providers.prefixes]]
prefix   = ";"
provider = "providerlist"

[[providers.prefixes]]
prefix   = ">"
provider = "runner"

[[providers.prefixes]]
prefix   = "/"
provider = "files"

[[providers.prefixes]]
prefix   = "="
provider = "calc"

[[providers.prefixes]]
prefix   = "@"
provider = "websearch"

[[providers.prefixes]]
prefix   = ":"
provider = "clipboard"